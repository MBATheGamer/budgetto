<dialog #nativeDialog class="modal">
  <div class="modal-box max-w-md">
    <div class="flex justify-between items-center border-b border-base-300 pb-3 mb-4">
      <h3 class="font-bold text-lg">
        {{ isEditing ? "✏ Edit transaction" : "✚ New transaction" }}
      </h3>
      <form method="dialog">
        <button class="btn btn-ghost btn-sm btn-circle text-base">✕</button>
      </form>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div role="tablist" class="tabs tabs-boxed rounded-lg mb-4 p-1 bg-base-200">
        <button
          type="button"
          class="tab w-1/2 !rounded-md"
          (click)="form.patchValue({ type: 'EXPENSE' })"
          [class.bg-primary]="form.value.type === 'EXPENSE'"
          [class.text-primary-content]="form.value.type === 'EXPENSE'"
        >
          Expense
        </button>

        <button
          type="button"
          class="tab w-1/2 !rounded-md"
          (click)="form.patchValue({ type: 'INCOME' })"
          [class.bg-primary]="form.value.type === 'INCOME'"
          [class.text-primary-content]="form.value.type === 'INCOME'"
        >
          Income
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="floating-label w-full">
            <span class="text-xs font-semibold uppercase tracking-wider">Description *</span>
            <input
              formControlName="description"
              type="text"
              placeholder="e.g. Groceries, Rent, Salary…"
              class="input input-bordered w-full"
              [class.input-error]="isInvalid('description')"
            />
          </label>
          @if (isInvalid("description")) {
            <span class="text-error text-xs">Description is required.</span>
          }
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="floating-label">
              <span class="text-xs font-semibold uppercase tracking-wider">Amount (€) *</span>
              <input
                formControlName="amount"
                type="number"
                class="input input-bordered w-full"
                [class.input-error]="isInvalid('amount')"
              />
            </label>
            @if (isInvalid("amount")) {
              <span class="text-error text-xs">Amount is required.</span>
            }
          </div>
          <div>
            <label class="floating-label">
              <span class="text-xs font-semibold uppercase tracking-wider">Date *</span>
              <input
                formControlName="transactionDate"
                type="date"
                class="input input-bordered w-full"
                [class.input-error]="isInvalid('transactionDate')"
              />
            </label>
            @if (isInvalid("transactionDate")) {
              <span class="text-error text-xs">Date is required.</span>
            }
          </div>
        </div>

        <div>
          <label class="floating-label w-full">
            <span class="text-xs font-semibold uppercase tracking-wider">Category *</span>
            <select
              formControlName="categoryId"
              class="select select-bordered w-full"
              [class.select-error]="isInvalid('categoryId')"
            >
              <option [value]="null">Select a category</option>
              @for (category of categories(); track category.id) {
                <option [value]="category.id">{{ category.icon }} {{ category.name }}</option>
              }
            </select>
          </label>
          @if (isInvalid("categoryId")) {
            <span class="text-error text-xs">Category is required.</span>
          }
        </div>

        <label class="floating-label w-full">
          <span class="text-xs font-semibold uppercase tracking-wider"
            >Shared budget (optional)</span
          >
          <select formControlName="sharedBudgetId" class="select select-bordered w-full">
            <option [value]="null">— None (personal) —</option>
            @for (budget of sharedBudgets(); track budget.id) {
              <option [value]="budget.id">{{ budget.name }}</option>
            }
          </select>
        </label>

        <label class="floating-label w-full">
          <span class="text-xs font-semibold uppercase tracking-wider">Comment</span>
          <textarea
            formControlName="comment"
            class="textarea textarea-bordered w-full resize-none"
            placeholder="Optional note…"
            rows="2"
          ></textarea>
        </label>
      </div>

      <div class="modal-action mt-4 gap-2">
        <form method="dialog"><button class="btn btn-ghost btn-sm">Cancel</button></form>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="submitting()">
          @if (submitting()) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            {{ isEditing ? "Save changes" : "Save →" }}
          }
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
