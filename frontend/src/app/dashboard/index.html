<div class="h-screen bg-base-200 flex flex-col">
  <nav class="navbar sticky top-0 bg-base-100 border-b border-base-300 px-4 sm:px-8">
    <div class="flex-1 font-bold text-lg flex items-center gap-2">
      <span class="text-2xl">📊</span> Budgetto
    </div>
    @if (user()) {
      <div class="flex items-center gap-2">
        <span class="text-sm">{{ user()["first-name"] }} {{ user()["last-name"] }}</span>
        <button class="btn btn-ghost btn-sm" (click)="logout()">Sign out</button>
      </div>
    }
  </nav>

  <div class="flex-1 flex items-center justify-center">
    @if (user()) {
      <h1 class="text-2xl font-bold">Welcome, {{ user()["first-name"] }}!</h1>
    } @else {
      <span class="loading loading-spinner loading-md"></span>
    }
  </div>
</div>
