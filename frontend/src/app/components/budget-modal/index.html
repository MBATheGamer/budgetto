<dialog #nativeDialog class="modal">
  <div class="modal-box max-w-md">
    <div class="flex justify-between items-center border-b border-base-300 pb-3 mb-4">
      <h3 class="font-bold text-lg">
        {{ budget().id !== null ? "✏ Edit budget" : "◎ New budget" }}
      </h3>
      <form method="dialog">
        <button class="btn btn-ghost btn-sm btn-circle text-base">✕</button>
      </form>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        <label class="floating-label w-full">
          <span class="text-xs font-semibold uppercase tracking-wider">Category *</span>
          <select formControlName="category-id" class="select select-bordered w-full">
            <option [value]="null">Select a category</option>
            @for (category of categories(); track category.id) {
              <option [value]="category.id">
                {{ category.name }}
              </option>
            }
          </select>
        </label>

        <div class="grid grid-cols-2 gap-3">
          <label class="floating-label">
            <span class="text-xs font-semibold uppercase tracking-wider">Limit ({{ currency() }}) *</span>
            <input formControlName="amount-limit" type="number" class="input input-bordered" />
          </label>
          <label class="floating-label">
            <span class="text-xs font-semibold uppercase tracking-wider">Period *</span>
            <select formControlName="period" class="select select-bordered">
              <option value="MONTHLY">Monthly</option>
              <option value="WEEKLY">Weekly</option>
              <option value="CUSTOM">Custom</option>
            </select>
          </label>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <label class="floating-label">
            <span class="text-xs font-semibold uppercase tracking-wider">Start date *</span>
            <input formControlName="start-date" type="date" class="input input-bordered" />
          </label>
          <label class="floating-label">
            <span class="text-xs font-semibold uppercase tracking-wider">End date</span>
            <input formControlName="end-date" type="date" class="input input-bordered" />
          </label>
        </div>

        <label class="floating-label w-full">
          <span class="text-xs font-semibold uppercase tracking-wider">Alert threshold (%)</span>
          <input
            formControlName="alert-threshold"
            type="number"
            class="input input-bordered w-full"
          />
        </label>
      </div>

      <div class="modal-action mt-4 gap-2">
        <form method="dialog"><button class="btn btn-ghost btn-sm">Cancel</button></form>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="submitting()">
          @if (submitting()) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            {{ budget().id !== null ? "Save changes" : "Create budget" }}
          }
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
