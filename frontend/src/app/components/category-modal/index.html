<dialog #nativeDialog class="modal">
  <div class="modal-box max-w-sm">
    <div class="flex justify-between items-center border-b border-base-300 pb-3 mb-4">
      <h3 class="font-bold text-lg">
        {{ category().id !== null ? "✏ Edit category" : "⊞ New category" }}
      </h3>
      <form method="dialog">
        <button class="btn btn-ghost btn-sm btn-circle text-base">✕</button>
      </form>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="space-y-6">
        <label class="floating-label w-full">
          <span class="text-xs font-semibold uppercase tracking-wider">Category name *</span>
          <input
            formControlName="name"
            type="text"
            placeholder="Ex. : Subscriptions, Gifts…"
            class="input input-bordered w-full"
          />
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="floating-label">
            <span class="text-xs font-semibold uppercase tracking-wider">Icon (emoji)</span>
            <input formControlName="icon" type="text" class="input input-bordered" />
          </label>
          <label class="floating-label">
            <span class="text-xs font-semibold uppercase tracking-wider">Type *</span>
            <select formControlName="type" class="select select-bordered">
              <option value="EXPENSE">Expense</option>
              <option value="INCOME">Income</option>
            </select>
          </label>
        </div>
      </div>
      <div class="modal-action mt-4 gap-2">
        <form method="dialog"><button class="btn btn-ghost btn-sm">Cancel</button></form>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="submitting()">
          @if (submitting()) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            {{ category().id !== null ? "Save changes" : "Create" }}
          }
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
